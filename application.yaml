apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pki-helm
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: lxhome
  source:
    repoURL: https://github.com/Raj34970/pki-helm.git
    targetRevision: main
    path: lxhome/pki
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true’