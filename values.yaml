namespace: lxhome

cert-manager:
  enabled: true
  installCRDs: true
  namespace: cert-manager

# Base64 encoded values for your Root CA cert and key
# Generate using: cat ca.crt | base64 -w0
rootCA:
  crt: ""
  key: ""

edgeCertificate:
  secretName: edge-tls-secret
  commonName: "*.k3s.lxhome.local"
  dnsNames:
    - "*.k3s.lxhome.local"
    - "proxy.lxhome.local"