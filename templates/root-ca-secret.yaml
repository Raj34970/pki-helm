apiVersion: v1
kind: Secret
metadata:
  name: root-ca-secret
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.rootCA.crt | required "A valid .Values.rootCA.crt base64 string is required!" }}
  tls.key: {{ .Values.rootCA.key | required "A valid .Values.rootCA.key base64 string is required!" }}